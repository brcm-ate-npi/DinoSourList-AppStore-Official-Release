name: Verify published macOS automatic update
on:
  push:
    branches: [diagnostics/dinosaurlist-update]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update-proof:
    runs-on: self-host-osx
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify real published app automatic download and next-start apply
        shell: bash
        run: ./scripts/verify-native-update-macos.sh
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: native-update-evidence
          path: ${{ runner.temp }}/native-update-evidence
