name: Verify published native automatic updates
on:
  push:
    branches: [diagnostics/dinosaurlist-update]
  workflow_dispatch:
    inputs:
      fromVersion:
        description: Published baseline version
        type: string
        default: 0.1.0-preview.20261118.13
      mode:
        description: Automatic update behavior to verify
        type: choice
        options: [next-start, startup]
        default: next-start
permissions:
  contents: read
jobs:
  update-proof:
    runs-on: self-host-osx
    timeout-minutes: 12
    env:
      NATIVE_UPDATE_FROM: ${{ inputs.fromVersion || '0.1.0-preview.20261118.13' }}
      NATIVE_EXPECT_STARTUP_APPLY: ${{ inputs.mode == 'startup' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Preserve previous Velopack diagnostics
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-update-evidence"
          if [ -f "$HOME/Library/Logs/velopack_DinoSaurListNative.log" ]; then tail -n 300 "$HOME/Library/Logs/velopack_DinoSaurListNative.log" > "$RUNNER_TEMP/native-update-evidence/previous-velopack.log"; fi
      - name: Verify real published app automatic download and next-start apply
        shell: bash
        run: ./scripts/verify-native-update-macos.sh
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        continue-on-error: true
        with:
          name: native-update-evidence
          path: ${{ runner.temp }}/native-update-evidence
  windows-startup-proof:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'startup'
    runs-on: self-host-win11
    timeout-minutes: 12
    env:
      NATIVE_UPDATE_FROM: ${{ inputs.fromVersion }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify one-launch published Windows automatic update
        shell: pwsh
        run: ./scripts/verify-native-update-windows.ps1
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        continue-on-error: true
        with:
          name: native-windows-update-evidence
          path: ${{ runner.temp }}/native-update-evidence
