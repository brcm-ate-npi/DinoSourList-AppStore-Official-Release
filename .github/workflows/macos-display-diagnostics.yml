name: Diagnose macOS native display timer
on:
  push:
    branches: ['diagnostics/dinosaurlist-macos']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corevideo:
    runs-on: self-host-osx
    timeout-minutes: 5
    steps:
      - name: Probe CoreVideo independently of .NET and Avalonia
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/corevideo-evidence"
          mkdir -p "$evidence"
          cat > "$evidence/probe.swift" <<'SWIFT'
          import AppKit
          import CoreVideo
          import CoreGraphics
          let application = NSApplication.shared
          print("macOS: \(ProcessInfo.processInfo.operatingSystemVersionString)")
          print("Main display: \(CGMainDisplayID()), online: \(CGDisplayIsOnline(CGMainDisplayID()))")
          var all: CVDisplayLink?
          let allResult = CVDisplayLinkCreateWithActiveCGDisplays(&all)
          print("CVDisplayLinkCreateWithActiveCGDisplays: \(allResult)")
          var main: CVDisplayLink?
          let mainResult = CVDisplayLinkCreateWithCGDisplay(CGMainDisplayID(), &main)
          print("CVDisplayLinkCreateWithCGDisplay(main): \(mainResult)")
          if let link = main {
              let callback: CVDisplayLinkOutputCallback = { _, _, _, _, _, _ in return kCVReturnSuccess }
              print("SetOutputCallback: \(CVDisplayLinkSetOutputCallback(link, callback, nil))")
              print("Start: \(CVDisplayLinkStart(link))")
              CVDisplayLinkStop(link)
          }
          SWIFT
          xcrun swiftc "$evidence/probe.swift" -o "$evidence/probe"
          "$evidence/probe" | tee "$evidence/runner-session.log"
          label="net.brcm.dinosaurlist.cvprobe.$GITHUB_RUN_ID"
          plist="$evidence/probe.plist"
          plutil -create xml1 "$plist"
          plutil -insert Label -string "$label" "$plist"
          plutil -insert ProgramArguments -array "$plist"
          plutil -insert ProgramArguments.0 -string "$evidence/probe" "$plist"
          plutil -insert RunAtLoad -bool YES "$plist"
          plutil -insert ProcessType -string Interactive "$plist"
          plutil -insert StandardOutPath -string "$evidence/aqua-session.log" "$plist"
          plutil -insert StandardErrorPath -string "$evidence/aqua-error.log" "$plist"
          domain="gui/$(id -u)"
          launchctl bootstrap "$domain" "$plist"
          trap 'launchctl bootout "$domain/$label" 2>/dev/null || true' EXIT
          for ((i=0;i<15;i++)); do
            if [ -s "$evidence/aqua-session.log" ]; then break; fi
            sleep 1
          done
          cat "$evidence/aqua-session.log"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: macos-corevideo-diagnostics
          path: ${{ runner.temp }}/corevideo-evidence
